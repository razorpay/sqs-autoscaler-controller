name: PR Workflow

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: build
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@v2
      - name: Start PMG (SafeDep Package Manager Guard)
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.PUBLIC_DOCKER_USERNAME }}
          password: ${{ secrets.PUBLIC_DOCKER_PASSWORD }}
      - name: build sqs-autoscaler-controller image
        uses: docker/build-push-action@v2
        with:
          tags: razorpay/sqs-autoscaler-controller:${{ github.sha }}
          push: true
          file: Dockerfile
          build-args: GIT_COMMIT_HASH=${{ github.sha }}
      - name: Enforce PMG policy
        if: always()
        run: pmg proxy stop --fail-on-violation
