service: sqs-autoscaler-controller  # required, canonical slug — immutable once registered
displayName: "SQS Autoscaler Controller"  # required, human-readable name — README title and the GitHub repo description "Kubernetes controller for scaling Deployments based on AWS SQS queue length"
description: "Kubernetes controller that watches SqsAutoScaler custom resources and scales the referenced Deployments up or down against configured thresholds based on the depth of an AWS SQS queue."  # required, one-sentence description of what the service does — README, including the SqsAutoScaler CRD example (spec.deployment, minPods/maxPods, queue, scaleUp/scaleDown amount + threshold) and `kubectl get sqsautoscalers`; the repo is a fork of uswitch/sqs-autoscaler-controller (GitHub parent field)
type: worker  # required, one of: service | worker | cron | library | pipeline — a long-running Go control loop (main.go + pkg/, Dockerfile, kubernetes.yaml) that polls SQS queue depth and patches Deployment replica counts; it exposes no HTTP/gRPC request surface and is not schedule-driven. It is genuinely deployed: Netra lists the deployment "sqs-autoscaler" in namespace autoscaler on both cde-green and prod-white with 4 downstream edges
tier: T2  # required, one of: T0 | T1 | T2 | T3 — Payments Reliability sheet Priority P2 → T2; kept. It is cluster-level infrastructure: if it stops, queue-driven consumers hold their current replica counts and backlogs build under load, which degrades throughput without directly failing requests
lifecycle: live  # optional, one of: incubating | live | deprecated | retired (default: live)
aliases: ["sqs-autoscaler"]  # alternate slugs this service is known by (source: Netra deployment inventory) — it runs as the deployment "sqs-autoscaler" in the autoscaler namespace, dropping the "-controller" suffix; recording it is what lets alert rules, dashboards and pipelines registered under the deployment name resolve back to this repo

domain: tech-infra/platform-core  # required, two-level domain/subgroup slug — the Payments Reliability sheet has no BU for this slug and the repo has no .github/repo_owners.json or CODEOWNERS; derived from what the code does — a cluster-level Kubernetes controller deployed in the autoscaler namespace on cde-green and prod-white, i.e. shared platform infrastructure, so family tech-infra and the existing platform-core area. If the service tree grows a dedicated devops/kubernetes-infra area, move it there

owner:
  team:  # required, owning team slug — TO FILL: this repo has no CODEOWNERS file, .github/repo_owners.json carries no team slug, and the GitHub repository-teams API is not readable with the current token; ask the POD lead for the owning GitHub team
  pm:  # product manager — TO FILL. Not derived on purpose: mapping the org tree to a PM is unreliable because PMs own products across org boundaries. Ask the POD lead.

